function summary(){var h=S.summary,sets=0,reps=0;h.ex.forEach(function(e){sets+=e.sets.length;e.sets.forEach(function(s){reps+=s.r})});
 app.innerHTML='<h1>Workout saved ✓</h1><p class="mut">'+esc(h.t)+'</p><div class="row"><div class="stat"><b>'+Math.round(h.dur/60)+'m</b>duration</div><div class="stat"><b>'+h.ex.length+'</b>exercises</div></div><div class="row" style="margin-top:8px"><div class="stat"><b>'+sets+'</b>sets</div><div class="stat"><b>'+reps+'</b>reps</div><div class="stat"><b>'+Math.round(vol(h))+'</b>volume</div></div>'+(h.pr.length?'<div class="card"><h3>Personal records</h3>'+h.pr.map(function(x){return '<div>🏆 '+esc(x)+'</div>'}).join('')+'</div>':'')+'<h2>Notes</h2><textarea rows="3" data-f="sn" placeholder="How did it feel?"></textarea><p><button class="btn" data-a="closesum">Done</button></p>';chrome.innerHTML=''}
function nav(){var t=[['home','Home'],['plan','Workouts'],['prog','Progress'],['nut','Nutrition'],['pro','Profile']];chrome.innerHTML='<nav>'+t.map(function(x){return '<button data-a="tab" data-t="'+x[0]+'" aria-current="'+(S.tab===x[0])+'">'+x[1]+'</button>'}).join('')+'</nav>'}
function home(){var d=new Date(),dow=d.getDay(),p=PLAN[dow],wd=weekDates(),wh=weekHist(),done=wh.length,today=iso(),n=S.nutri[today]||{},u=S.profile.units;
 var h='<h1>Today</h1><p class="mut">'+d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})+'</p><div class="card"><h3>'+p.t+'</h3>';
 if(p.e){h+='<p class="mut">'+p.e.length+' exercises · 50-60 min</p>'+(S.history.some(function(x){return x.date===today})?'<p>✓ Done today</p>':'')+'<button class="btn" data-a="start" data-d="'+dow+'">'+(S.history.some(function(x){return x.date===today})?'Train again':'Start workout')+'</button>'}
 else h+='<p class="mut">'+p.rec+'</p><button class="btn s" data-a="recdone">'+(S.rec[today]?'✓ Marked done':'Mark day complete')+'</button>';
 h+='</div><div class="card"><h3>This week · '+done+'/5 sessions</h3>'+bar(done,5);
 wd.forEach(function(x){var k=x.getDay(),pl=PLAN[k],dn=S.history.some(function(y){return y.date===iso(x)})||S.rec[iso(x)];h+='<div class="day'+(k===dow?' t':'')+'"><span>'+DN[k]+' · '+pl.t+'</span><span>'+(dn?'✓':'')+'</span></div>'});
 h+='</div><div class="card"><h3>Protein today</h3><p class="mut">'+(n.pro||0)+' / '+S.profile.protein+' g</p>'+bar(n.pro||0,S.profile.protein)+'</div>';
 h+='<div class="card"><h3>Quick log</h3><div class="row"><div><label>Weight ('+u+')</label><input id="qw" type="number" inputmode="decimal" min="0" step="any"></div><div><label>Waist (in)</label><input id="qa" type="number" inputmode="decimal" min="0" step="any"></div></div><p><button class="btn s" data-a="body">Save</button></p></div>';
 h+='<h2>Recent</h2>'+(S.history.length?S.history.slice(-3).reverse().map(function(x){return '<div class="card"><b>'+esc(x.t)+'</b><div class="mut">'+x.date+' · '+Math.round(x.dur/60)+' min · volume '+Math.round(vol(x))+'</div></div>'}).join(''):'<div class="card mut">Finish your first workout to see it here.</div>');
 app.innerHTML=h}
function plan(){var h='<h1>Workouts</h1><p class="mut">Your 5-day plan. Tap Start on any session.</p>';
 [1,2,3,4,5,6,0].forEach(function(k){var p=PLAN[k];h+='<div class="card"><h3>'+DN[k]+' · '+p.t+'</h3>';
  if(p.e){p.e.forEach(function(e){h+='<div class="day"><span>'+esc(S.sub[e.n]||e.n)+(S.sub[e.n]?' ↔':'')+'<br><span class="mut">'+e.m+'</span></span><span class="mut">'+e.s+'×'+e.lo+'-'+e.hi+' · '+e.r+'s</span></div><details><summary class="mut" style="padding:4px 0">Form guide</summary>'+ill(S.sub[e.n]||e.n)+'</details>'});h+='<p><button class="btn s" data-a="start" data-d="'+k+'">Start</button></p>'}else h+='<p class="mut">'+p.rec+'</p>';h+='</div>'});
 h+='<h2>History</h2>'+(S.history.length?S.history.slice().reverse().map(function(x){return '<div class="card"><b>'+esc(x.t)+'</b> <span class="mut">'+x.date+'</span>'+x.ex.map(function(e){return '<div class="mut">'+esc(e.n)+': '+e.sets.map(function(s){return s.w+'×'+s.r}).join(', ')+'</div>'}).join('')+'<p><button class="btn s" data-a="del" data-id="'+x.id+'">Delete</button></p></div>'}).join(''):'<div class="card mut">No workouts logged yet.</div>');
 app.innerHTML=h}
function prog(){var c={};weekHist().forEach(function(x){x.ex.forEach(function(e){c[e.m]=(c[e.m]||0)+e.sets.length})});
 var h='<h1>Progress</h1><div class="card"><h3>Weekly direct sets</h3><p class="mut">Completed vs. target. Targets are a guide, not a rule: adjust for recovery.</p>';
 Object.keys(TG).forEach(function(m){h+='<div style="margin:10px 0"><div class="row"><span>'+m+'</span><span class="mut" style="text-align:right">'+(c[m]||0)+' / '+TG[m]+'</span></div>'+bar(c[m]||0,TG[m])+'</div>'});
 h+='</div><div class="card"><h3>Body log</h3>'+(S.body.length?S.body.slice(-8).reverse().map(function(b){return '<div class="day"><span>'+b.d+'</span><span>'+(b.w?b.w+' '+S.profile.units:'')+(b.a?' · waist '+b.a+'"':'')+'</span></div>'}).join(''):'<p class="mut">Log weight and waist from Home. The goal is a shrinking waist with steady strength.</p>');
 var lw=S.body.filter(function(b){return b.w}).slice(-7);if(lw.length>1)h+='<p class="mut">7-entry avg weight: '+(lw.reduce(function(t,b){return t+b.w},0)/lw.length).toFixed(1)+' '+S.profile.units+'</p>';
 app.innerHTML=h+'</div>'}
function nut(){var t=iso(),n=S.nutri[t]||{},ks=Object.keys(S.nutri).sort().slice(-7),ap=0,ac=0;ks.forEach(function(k){ap+=S.nutri[k].pro||0;ac+=S.nutri[k].cal||0});
 app.innerHTML='<h1>Nutrition</h1><div class="card"><h3>Today</h3><div class="row"><div><label>Calories</label><input id="nc" type="number" inputmode="numeric" min="0" value="'+(n.cal||'')+'"></div><div><label>Protein (g)</label><input id="np" type="number" inputmode="numeric" min="0" value="'+(n.pro||'')+'"></div></div><p><button class="btn s" data-a="nut">Save</button></p><p class="mut">Protein '+(n.pro||0)+' / '+S.profile.protein+' g</p>'+bar(n.pro||0,S.profile.protein)+'</div><div class="card"><h3>Last '+ks.length+' days avg</h3><p>'+(ks.length?Math.round(ac/ks.length)+' kcal · '+Math.round(ap/ks.length)+' g protein':'<span class="mut">No entries yet.</span>')+'</p></div><p class="mut">Ab exercises build the core but don\'t burn belly fat specifically. Review calories after 2-3 consistent weeks, not one weigh-in.</p>'}
function pro(){app.innerHTML='<h1>Profile</h1><div class="card"><label>Units</label><div class="row"><button class="btn s" data-a="u" data-u="lb">lb'+(S.profile.units==='lb'?' ✓':'')+'</button><button class="btn s" data-a="u" data-u="kg">kg'+(S.profile.units==='kg'?' ✓':'')+'</button></div><label style="margin-top:12px">Protein target (g)</label><input type="number" inputmode="numeric" min="0" data-p="protein" value="'+S.profile.protein+'"><label style="margin-top:12px">Calorie target (optional)</label><input type="number" inputmode="numeric" min="0" data-p="cal" value="'+esc(S.profile.cal)+'"></div><div class="card"><h3>Exercise swaps</h3><p class="mut">Swaps made during a workout stick for future ones.</p><button class="btn s" data-a="rsw">Reset all swaps</button></div><div class="card"><h3>Backup</h3><p class="mut">Data lives only in this browser on this device. Copy a backup now and then.</p><button class="btn s" data-a="copy">Copy backup to clipboard</button><p class="mut" id="cm"></p></div>'}
function render(){if(S.active){player();return}if(S.summary){summary();return}nav();({home:home,plan:plan,prog:prog,nut:nut,pro:pro})[S.tab]();window.scrollTo(0,0)}
document.addEventListener('input',function(e){var t=e.target,d=t.dataset;if(d.p){S.profile[d.p]=t.value===''?'':Math.max(0,+t.value);save();return}
 if(d.f==='sn'){if(S.history.length)S.history[S.history.length-1].notes=t.value;save();return}
 var a=S.active;if(!a||d.i==null)return;if(d.f==='n')a.ex[+d.i].note=t.value;else{if(t.value!==''&&+t.value<0){t.value='';return}a.ex[+d.i].rows[+d.j][d.f]=t.value}save()});
document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var d=b.dataset,a=S.active,x=d.a;
 if(x==='tab'){S.tab=d.t}
 else if(x==='start'){start(+d.d);return}
 else if(x==='done'){var e2=a.ex[+d.i],r=e2.rows[+d.j],p=(prev(e2.n)||[])[+d.j];if(!r.d){if(r.w===''&&p)r.w=p.w;if(r.r===''&&p)r.r=p.r;if(r.w===''||r.r===''||+r.r<=0){b.textContent='!';return}r.d=1;a.restEnd=Date.now()+e2.r*1000;a.left=null;a.tot=e2.r}else r.d=0}
 else if(x==='add'){a.ex[+d.i].rows.push({w:'',r:'',d:0})}
 else if(x==='rp'){if(a.left!=null){a.restEnd=Date.now()+a.left*1000;a.left=null}else if(a.restEnd){a.left=restLeft(a);a.restEnd=null}}
 else if(x==='rr'){if(a.tot){a.restEnd=Date.now()+a.tot*1000;a.left=null}}
 else if(x==='rk'){a.restEnd=null;a.left=null}
 else if(x==='swp'){S.sw=S.sw===+d.i?null:+d.i}
 else if(x==='swap'){var ee=a.ex[+d.i];ee.orig=ee.orig||ee.n;var nm=d.n==='-'?ee.orig:d.n;ee.n=nm;if(nm===ee.orig)delete S.sub[ee.orig];else S.sub[ee.orig]=nm;S.sw=null}
 else if(x==='rsw'){S.sub={}}
 else if(x==='finish'){finish();return}
 else if(x==='discard'){if(confirm('Discard this workout?')){S.active=null}else return}
 else if(x==='closesum'){S.summary=null;S.tab='home'}
 else if(x==='recdone'){S.rec[iso()]=!S.rec[iso()]}
 else if(x==='body'){var w=parseFloat(document.getElementById('qw').value),c=parseFloat(document.getElementById('qa').value);if(!(w>0)&&!(c>0))return;S.body.push({d:iso(),w:w>0?w:null,a:c>0?c:null})}
 else if(x==='nut'){var c2=parseInt(document.getElementById('nc').value)||0,p2=parseInt(document.getElementById('np').value)||0;S.nutri[iso()]={cal:Math.max(0,c2),pro:Math.max(0,p2)}}
 else if(x==='del'){if(confirm('Delete this workout?'))S.history=S.history.filter(function(h){return h.id!==+d.id});else return}
 else if(x==='u'){S.profile.units=d.u}
 else if(x==='copy'){var j=JSON.stringify(S);try{navigator.clipboard.writeText(j).then(function(){document.getElementById('cm').textContent='Copied.'},function(){document.getElementById('cm').textContent='Copy blocked by the browser.'})}catch(er){document.getElementById('cm').textContent='Copy blocked by the browser.'}return}
 save();render()});
render()})();
